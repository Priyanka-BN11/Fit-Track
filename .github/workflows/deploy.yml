name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main_pg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      - name: Deploy Frontend to GitHub Pages
        run: |
          cd frontend
          npm run deploy  # Ensure the deploy script is set up in package.json

      - name: Deploy Backend
        run: |
          cd backend
          # Add deployment commands here (e.g., for Heroku, AWS, etc.)
          # Example for Heroku:
          # git remote add heroku https://git.heroku.com/YOUR_HEROKU_APP.git
          # git push heroku main